apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: docverify
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
# NodePort variant so the service is reachable from the host on a kind cluster.
apiVersion: v1
kind: Service
metadata:
  name: docverify-nodeport
  labels:
    app: docverify
spec:
  type: NodePort
  selector:
    app: docverify
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
