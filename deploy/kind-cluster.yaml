kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: docverify
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # docverify REST
        hostPort: 30080
      - containerPort: 30900   # prometheus
        hostPort: 30900
      - containerPort: 30300   # grafana
        hostPort: 30300
  - role: worker
